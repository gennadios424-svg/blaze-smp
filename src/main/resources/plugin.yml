name: BlazeSMP
version: 1.2.0
main: com.blazesmp.BlazeSMP
api-version: '1.21'
author: BlazeSMP
commands:
  worth:
    description: View item sell values
    usage: /worth [search]
  sell:
    description: Sell items for money
    usage: /sell
  balance:
    description: View your balance
    aliases: [bal, money]
  eco:
    description: Economy administration
    usage: /eco <give|take|set> <player> <amount>
    permission: blazesmp.eco
  drill:
    description: Give a 3x3 Drill
    usage: /drill
    permission: blazesmp.drill
  shardgainer:
    description: Give a Shardgainer
    usage: /shardgainer
    permission: blazesmp.shardgainer
  shards:
    description: View or manage Emerald Shards
    usage: /shards [player|give|take|set]
  rank:
    description: View or manage Blaze SMP ranks
    usage: /rank <player> OR /rank set <player> <rank>
permissions:
  blazesmp.eco:
    default: false
  blazesmp.drill:
    default: false
  blazesmp.shardgainer:
    default: false
  blazesmp.shards.others:
    default: false
  blazesmp.shards.admin:
    default: false
  blazesmp.rank.manage:
    default: false
