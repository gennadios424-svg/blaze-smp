name: Build Blaze SMP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean test package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlazeSMP
          path: target/blaze-smp-*.jar
          if-no-files-found: error
